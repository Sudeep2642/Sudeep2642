name: Update Jet Contribution Heatmap

on:
  schedule:
    # Runs once a day at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_jet_heatmap.py"
      - ".github/workflows/jet-heatmap.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate jet heatmap
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          # Uses the built-in token by default. If your contribution data
          # doesn't show up, create a PAT with `read:user` scope, add it
          # as a repo secret named PAT_TOKEN, and it'll be used instead.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python scripts/generate_jet_heatmap.py

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/light.svg dist/dark.svg dist/github-jet.svg
          git diff --staged --quiet || git commit -m "chore: update jet contribution heatmap"
          git push
